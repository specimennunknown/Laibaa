<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --burgundy: #1B0A13;
      --deep-burgundy: #11050A;
      --rose-gold: #D4AF37;
      --rose-gold-light: #F3E5AB;
      --blush: #FAD4E2;
      --rose: #C8526A;
      --soft-pink: #F7C5D5;
      --cream: #FDF8F5;
      --card-bg: rgba(34, 15, 25, 0.55);
      --card-border: rgba(212, 175, 55, 0.25);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--deep-burgundy);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 30px 15px;
    }

    /* ── ANIMATED GRADIENT BACKGROUND & PARTICLES ── */
    body::before {
      content: '';
      position: fixed;
      inset: -50%;
      background: radial-gradient(circle at 20% 30%, rgba(200, 82, 106, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.12), transparent 45%),
                  radial-gradient(circle at 50% 90%, rgba(247, 197, 213, 0.15), transparent 50%);
      animation: gradientShift 18s ease infinite alternate;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes gradientShift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-4%, 4%) scale(1.06); }
      100% { transform: translate(4%, -4%) scale(1.1); }
    }

    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .petal {
      position: absolute;
      width: 10px; height: 14px;
      background: var(--rose);
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-40px) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ── LOCK SCREEN ── */
    #lock-screen {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 24px;
      padding: 50px 36px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      max-width: 400px; width: 100%;
      animation: fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(35px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lock-icon { font-size: 3rem; line-height: 1; filter: drop-shadow(0 4px 10px rgba(212,175,55,0.3)); }
    .lock-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.85rem; font-weight: 300; font-style: italic;
      color: var(--blush); text-align: center; letter-spacing: .03em;
    }
    .lock-hint {
      font-size: .78rem; color: rgba(245,208,216,.5);
      letter-spacing: .15em; text-transform: uppercase;
    }
    .pw-input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 14px;
      color: var(--cream);
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      letter-spacing: .35em;
      text-align: center;
      outline: none;
      transition: all .3s ease;
    }
    .pw-input:focus { 
      border-color: var(--rose-gold); 
      box-shadow: 0 0 15px rgba(212,175,55,0.2);
    }
    .pw-input::placeholder { letter-spacing: .1em; color: rgba(255,255,255,.2); }

    .unlock-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--rose), #a33850);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(200,82,106,0.3);
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .unlock-btn:hover  { 
      background: linear-gradient(135deg, #d95e78, var(--rose)); 
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(200,82,106,0.4);
    }
    .unlock-btn:active { transform: scale(.97); }

    .error-msg {
      font-size: .78rem; color: #ff7a8a;
      letter-spacing: .05em; min-height: 18px;
      text-align: center;
      transition: opacity .3s;
    }

    /* ── LOVE SCREEN ── */
    #love-screen {
      display: none;
      position: relative; z-index: 10;
      flex-direction: column; align-items: center;
      max-width: 700px; width: 100%;
      padding: 50px 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    #love-screen.visible { display: flex; }

    /* flowers / header */
    .flowers {
      font-size: clamp(3.2rem, 10vw, 5.5rem);
      line-height: 1;
      animation: bloom 1s cubic-bezier(.34,1.56,.64,1) both;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 12px rgba(200,82,106,0.4));
    }
    @keyframes bloom {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    .love-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.3rem, 7vw, 3.8rem);
      font-weight: 300;
      color: var(--blush);
      letter-spacing: .03em;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .heart { color: var(--rose); display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }

    .divider {
      width: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
      margin: 28px auto;
    }

    /* ── SLIDESHOW SECTION ── */
    .slideshow-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.3);
      margin: 10px auto 25px auto;
      cursor: pointer;
    }
    .slideshow-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out, transform 6s ease;
      transform: scale(1);
    }
    .slideshow-slide.active {
      opacity: 1;
      transform: scale(1.04);
    }
    .slideshow-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── PHOTO GALLERY GRID ── */
    .gallery-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--rose-gold-light);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      margin-bottom: 30px;
    }
    .gallery-card {
      position: relative;
      height: 170px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.25);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }
    .gallery-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 18px 35px rgba(200,82,106,0.3);
      border-color: var(--rose-gold);
    }
    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .gallery-card:hover img {
      transform: scale(1.08);
    }

    /* ── LIGHTBOX MODAL ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(11, 4, 8, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }
    #lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }
    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      border: 1px solid var(--rose-gold);
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #lightbox.active img {
      transform: scale(1);
    }
    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 30px;
      font-size: 2.2rem;
      color: var(--cream);
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.3s, transform 0.3s;
    }
    .lightbox-close:hover {
      background: var(--rose);
      transform: rotate(90deg);
    }

    /* ── LOVE LETTER ── */
    .love-letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 3.2vw, 1.28rem);
      font-weight: 300;
      font-style: italic;
      line-height: 2.1;
      color: rgba(253,246,240,.88);
      text-align: center;
      padding: 0 10px;
    }

    .gfd-text {
      margin-top: 28px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.35rem, 4.2vw, 1.8rem);
      font-weight: 400;
      color: var(--rose-gold);
      letter-spacing: .08em;
      text-align: center;
      filter: drop-shadow(0 2px 8px rgba(212,175,55,0.25));
    }

    .signature {
      margin-top: 28px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--rose-gold-light);
      letter-spacing: .1em;
      text-align: center;
    }

    /* floating hearts */
    .float-heart {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatUp 3.5s ease-in forwards;
      z-index: 5;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-95vh) scale(0.5); opacity: 0; }
    }

    @media (max-width: 480px) {
      body { padding: 15px 10px; }
      #love-screen { padding: 35px 20px; }
      #lock-screen { padding: 40px 24px; }
      .gallery-grid { grid-template-columns: 1fr; gap: 14px; }
      .gallery-card { height: 210px; }
      .slideshow-container { height: 240px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>

  <div id="particles"></div>

  <!-- LOCK SCREEN -->
  <div id="lock-screen">
    <div class="lock-icon">🔒</div>
    <h1 class="lock-title">This page is just for you…</h1>
    <p class="lock-hint">Enter the password to open</p>
    <input class="pw-input" id="pw" type="password" placeholder="••••" maxlength="8"
      autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="unlock-btn" onclick="tryUnlock()">Open ✦</button>
    <p class="error-msg" id="err"></p>
  </div>

  <!-- LOVE SCREEN -->
  <div id="love-screen">
    <div class="flowers" id="flowers">🌹🌸🌺🌹🌸</div>
    <h1 class="love-title">I love you, Laiba <span class="heart">❤️</span></h1>
    <div class="divider"></div>

    <!-- Automatic Slideshow -->
    <p class="gallery-label">A Glimpse of Us ✦</p>
    <div class="slideshow-container" onclick="openLightbox(document.getElementById('active-slide-img').src)">
      <div class="slideshow-slide active"><img src="photo1.jpg" id="active-slide-img" alt="Memory 1"></div>
      <div class="slideshow-slide"><img src="photo2.jpg" alt="Memory 2"></div>
      <div class="slideshow-slide"><img src="photo3.jpg" alt="Memory 3"></div>
      <div class="slideshow-slide"><img src="photo4.jpg" alt="Memory 4"></div>
    </div>

    <!-- Photo Gallery Grid -->
    <div class="gallery-grid">
      <div class="gallery-card" onclick="openLightbox('photo1.jpg')">
        <img src="photo1.jpg" alt="Photo 1">
      </div>
      <div class="gallery-card" onclick="openLightbox('photo2.jpg')">
        <img src="photo2.jpg" alt="Photo 2">
      </div>
      <div class="gallery-card" onclick="openLightbox('photo3.jpg')">
        <img src="photo3.jpg" alt="Photo 3">
      </div>
      <div class="gallery-card" onclick="openLightbox('photo4.jpg')">
        <img src="photo4.jpg" alt="Photo 4">
      </div>
    </div>

    <div class="divider"></div>
    <p class="love-letter" id="letter"></p>
    <div class="divider"></div>
    <p class="gfd-text">🎀 Happy Girlfriend's Day, Laiba 🎀</p>
    <p class="signature">— always & forever yours 🕊️</p>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Fullscreen view">
  </div>

  <script>
    /* ── Petals background generator ── */
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 6 + Math.random() * 10;
      p.style.cssText = `
        width:${size}px; height:${size*1.4}px;
        left:${Math.random()*100}vw;
        animation-duration:${6+Math.random()*9}s;
        animation-delay:${Math.random()*10}s;
        opacity:${0.3+Math.random()*.5};
        background:hsl(${340+Math.random()*30},${60+Math.random()*20}%,${55+Math.random()*20}%);
      `;
      container.appendChild(p);
    }

    /* ── Password Unlock Logic ── */
    const PASSWORD = '110';
    function tryUnlock() {
      const val = document.getElementById('pw').value.trim();
      const err = document.getElementById('err');
      if (val === PASSWORD) {
        document.getElementById('lock-screen').style.display = 'none';
        showLove();
      } else {
        err.textContent = 'Hmm, that\'s not right — try again 💔';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryUnlock();
    });

    /* ── Slideshow Logic <div> cycle ── */
    let currentSlideIndex = 0;
    const slides = document.getElementsByClassName('slideshow-slide');
    const activeSlideImg = document.getElementById('active-slide-img');
    
    function startSlideshow() {
      setInterval(() => {
        slides[currentSlideIndex].classList.remove('active');
        currentSlideIndex = (currentSlideIndex + 1) % slides.length;
        slides[currentSlideIndex].classList.add('active');
        // Update active source for main click-to-lightbox reference
        activeSlideImg.src = slides[currentSlideIndex].querySelector('img').src;
      }, 4000);
    }

    /* ── Lightbox Functions ── */
    function openLightbox(src) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // Close lightbox on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    /* ── Love Screen Content & Typewriter ── */
    const para = `From the very first moment you walked into my life, everything felt a little brighter, 
a little softer, and a whole lot more worth living for. Laiba, you carry this quiet magic 
that makes even the most ordinary days feel like something worth remembering. 
The way you laugh — genuinely, freely — is the most beautiful sound I know. 
The way you care, deeply and without asking anything in return, 
reminds me every single day how lucky I am to be the one you chose. 
You are not just beautiful in every way the eye can see, 
you are beautiful in the way you think, the way you love, 
and the way you make the people around you feel seen and warm. 
I admire you more than words ever do justice. 
You are my safe place, my favourite person, 
and the reason I smile at my phone like an idiot at 2 in the morning. 
Thank you for being exactly who you are. 
I am so endlessly, hopelessly, happily in love with you.`;

    function showLove() {
      const ls = document.getElementById('love-screen');
      ls.classList.add('visible');
      startSlideshow();

      /* typewriter */
      const el = document.getElementById('letter');
      el.textContent = '';
      const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
      const full = lines.join(' ');
      let i = 0;
      const type = () => {
        if (i < full.length) {
          el.textContent += full[i++];
          setTimeout(type, 16);
        }
      };
      setTimeout(type, 600);

      /* floating hearts */
      launchHearts();
    }

    function launchHearts() {
      const emojis = ['❤️','🌹','💕','✨','💖'];
      let count = 0;
      const go = () => {
        if (count++ > 22) return;
        const h = document.createElement('span');
        h.className = 'float-heart';
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        h.style.left = (8 + Math.random() * 84) + 'vw';
        h.style.bottom = '0';
        h.style.animationDuration = (2.5 + Math.random()*2) + 's';
        document.body.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
        setTimeout(go, 260);
      };
      setTimeout(go, 400);
    }
  </script>
</body>
</html>
